services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: his
      POSTGRES_PASSWORD: his
      POSTGRES_DB: his
    ports: ["5433:5432"]
    volumes:
      - his_pgdata:/var/lib/postgresql/data
      - ./docker/init-test-db.sql:/docker-entrypoint-initdb.d/10-test-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U his -d his"]
      interval: 2s
      timeout: 3s
      retries: 30
volumes:
  his_pgdata:
